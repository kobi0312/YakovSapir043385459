<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }

        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background: url('../../images/background.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: url('../../images/menuback1.png') no-repeat center center/cover;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            padding: 10px 20px;
        }

        .navbar .logo { max-width: 100px; }
        .navbar .avatar { max-width: 90px; }
        .navbar .nav-links { display: flex; list-style: none; gap: 40px; margin: 0; }
        .navbar .nav-links a { text-decoration: none; color: #333; font-weight: bold; font-size: 1.1rem; }
        .navbar .nav-links a:hover { color: #007BFF; }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 120px;
            padding-bottom: 60px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            padding: 40px 50px;
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .weather-card h1 { font-size: 2rem; margin-bottom: 6px; color: #222; }
        .weather-card .subtitle { color: #777; margin-bottom: 30px; font-size: 0.95rem; }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-row input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .search-row input:focus { outline: none; border-color: #007BFF; }

        .search-row button {
            padding: 12px 22px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-row button:hover { background: #0062cc; }

        .loading { color: #007BFF; margin-top: 16px; display: none; }
        .error-msg { color: #dc3545; font-weight: bold; margin-top: 16px; display: none; }

        .weather-result { display: none; margin-top: 10px; }

        .weather-hero {
            background: linear-gradient(135deg, #007BFF, #0062cc);
            border-radius: 12px;
            padding: 30px 20px;
            color: white;
            margin-bottom: 16px;
        }

        .city-name { font-size: 1.6rem; font-weight: bold; }
        .country-name { font-size: 1rem; opacity: 0.85; margin-bottom: 12px; }
        .weather-icon { font-size: 5rem; margin: 10px 0; }
        .weather-condition { font-size: 1.1rem; opacity: 0.9; margin-bottom: 16px; }
        .temperature { font-size: 4rem; font-weight: bold; line-height: 1; }
        .feels-like { font-size: 0.9rem; opacity: 0.8; margin-top: 4px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-box {
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            padding: 16px 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-icon { font-size: 1.6rem; margin-bottom: 4px; }
        .stat-label { font-size: 0.75rem; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.1rem; font-weight: bold; color: #333; margin-top: 2px; }

        footer {
            text-align: center;
            padding: 20px;
            color: rgba(0,0,0,0.6);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="../weather-app.html">
            <img src="../../images/logo.png" alt="Logo" class="logo">
        </a>
        <ul class="nav-links">
            <li><a href="../weather-app.html">&#8592; Back</a></li>
        </ul>
        <img src="../../images/avatar.png" alt="Avatar" class="avatar">
    </nav>

    <div class="page-wrapper">
        <div class="weather-card">
            <h1>🌤️ Weather App</h1>
            <p class="subtitle">Search any city for live weather — no API key required</p>

            <div class="search-row">
                <input type="text" id="city-input" placeholder="Enter city name (e.g. Tel Aviv)" />
                <button id="search-btn">Search</button>
            </div>

            <div class="loading" id="loading">Fetching weather data...</div>
            <div class="error-msg" id="error-msg"></div>

            <div class="weather-result" id="weather-result">
                <div class="weather-hero">
                    <div class="city-name" id="city-name"></div>
                    <div class="country-name" id="country-name"></div>
                    <div class="weather-icon" id="weather-icon"></div>
                    <div class="weather-condition" id="weather-condition"></div>
                    <div class="temperature" id="temperature"></div>
                    <div class="feels-like" id="feels-like"></div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-icon">💨</div>
                        <div class="stat-label">Wind Speed</div>
                        <div class="stat-value" id="wind-speed"></div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon">💧</div>
                        <div class="stat-label">Humidity</div>
                        <div class="stat-value" id="humidity"></div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon">🌡️</div>
                        <div class="stat-label">Feels Like</div>
                        <div class="stat-value" id="apparent-temp"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 KS DIGITAL — Powered by <a href="https://open-meteo.com" target="_blank" rel="noopener noreferrer">Open-Meteo API</a></p>
    </footer>

    <script>
        const cityInput = document.getElementById('city-input');
        const searchBtn = document.getElementById('search-btn');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');
        const weatherResult = document.getElementById('weather-result');

        const WMO_CODES = {
            0: ['Clear Sky', '☀️'],
            1: ['Mainly Clear', '🌤️'], 2: ['Partly Cloudy', '⛅'], 3: ['Overcast', '☁️'],
            45: ['Foggy', '🌫️'], 48: ['Icy Fog', '🌫️'],
            51: ['Light Drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Heavy Drizzle', '🌧️'],
            61: ['Light Rain', '🌧️'], 63: ['Rain', '🌧️'], 65: ['Heavy Rain', '🌧️'],
            71: ['Light Snow', '🌨️'], 73: ['Snow', '❄️'], 75: ['Heavy Snow', '❄️'],
            77: ['Snow Grains', '🌨️'],
            80: ['Light Showers', '🌦️'], 81: ['Showers', '🌧️'], 82: ['Violent Showers', '⛈️'],
            85: ['Snow Showers', '🌨️'], 86: ['Heavy Snow Showers', '❄️'],
            95: ['Thunderstorm', '⛈️'],
            96: ['Thunderstorm w/ Hail', '⛈️'], 99: ['Thunderstorm w/ Heavy Hail', '⛈️'],
        };

        function getWeatherInfo(code) {
            return WMO_CODES[code] || ['Unknown', '🌡️'];
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            weatherResult.style.display = 'none';
        }

        function hideError() { errorMsg.style.display = 'none'; }

        async function getWeather() {
            const city = cityInput.value.trim();
            if (!city) { showError('Please enter a city name.'); return; }

            hideError();
            loading.style.display = 'block';
            weatherResult.style.display = 'none';

            try {
                // Step 1: Geocode city name
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    showError(`City "${city}" not found. Try a different name.`);
                    loading.style.display = 'none';
                    return;
                }

                const { latitude, longitude, name, country } = geoData.results[0];

                // Step 2: Fetch weather
                const weatherRes = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}` +
                    `&current_weather=true&hourly=relativehumidity_2m,apparent_temperature` +
                    `&forecast_days=1&timezone=auto`
                );
                const weatherData = await weatherRes.json();

                const cw = weatherData.current_weather;
                const humidity = weatherData.hourly.relativehumidity_2m[0];
                const apparentTemp = weatherData.hourly.apparent_temperature[0];
                const [condition, icon] = getWeatherInfo(cw.weathercode);

                // Display results
                document.getElementById('city-name').textContent = name;
                document.getElementById('country-name').textContent = country;
                document.getElementById('weather-icon').textContent = icon;
                document.getElementById('weather-condition').textContent = condition;
                document.getElementById('temperature').textContent = `${Math.round(cw.temperature)}°C`;
                document.getElementById('feels-like').textContent = `Feels like ${Math.round(apparentTemp)}°C`;
                document.getElementById('wind-speed').textContent = `${cw.windspeed} km/h`;
                document.getElementById('humidity').textContent = `${humidity}%`;
                document.getElementById('apparent-temp').textContent = `${Math.round(apparentTemp)}°C`;

                weatherResult.style.display = 'block';
            } catch {
                showError('Failed to fetch weather. Please try again.');
            } finally {
                loading.style.display = 'none';
            }
        }

        searchBtn.addEventListener('click', getWeather);
        cityInput.addEventListener('keydown', e => { if (e.key === 'Enter') getWeather(); });
    </script>
</body>
</html>
